[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/soccerAI-app.html"
  status = 200
  force = false

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
